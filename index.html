<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths Terminale S Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center;
           align-items: center; min-height: 100vh; margin: 0; background: #1B5E20; }
    .card { background: white; padding: 2rem; border-radius: 16px;
            text-align: center; max-width: 400px; width: 90%; }
    h1 { color: #1B5E20; }
    p { color: #555; }
    .badge { background: #E8F5E9; color: #1B5E20; padding: 8px 16px;
             border-radius: 20px; font-weight: bold; display: inline-block; margin: 8px 0; }
  </style>
</head>
<body>
<div class="card">
  <h1>🧮 Maths Terminale S Quiz</h1>
  <p>Application de révision pour les élèves de Terminale S au Sénégal.</p>
  <div class="badge">12 chapitres · 240 questions</div><br>
  <div class="badge">500 FCFA · 1 an d'accès</div>
  <p style="margin-top:1.5rem; font-size:0.9rem; color:#888;">
    Disponible sur Google Play Store
  </p>
</div>
<script>
  // Si paramètre tx présent → page de confirmation paiement
  const params = new URLSearchParams(window.location.search);
  const tx = params.get('tx');
  if (tx) window.location.href = '/wave-callback/confirm.html' + window.location.search;
</script>
</body>
</html>
